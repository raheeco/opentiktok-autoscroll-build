
name: Build OpenTikTok APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Extract OpenTikTok source
        run: |
          test -f opentiktok-auto-scroll-source.zip
          mkdir -p source
          unzip -q opentiktok-auto-scroll-source.zip -d source
          test -f source/opentiktok-main/gradlew

      - name: Build debug APK
        working-directory: source/opentiktok-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTikTok-auto-scroll-debug-apk
          path: source/opentiktok-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
